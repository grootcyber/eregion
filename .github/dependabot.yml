# SEC-G (audit du 13/11, P-06) : l'empreinte de l'image de base des deux images, proposée à la montée.
#
# glorfindel/Dockerfile et annatar/Dockerfile partent de python:3.12-slim épinglé par son digest
# (SEC14) : un digest ne bouge pas, et rien ne le rafraîchissait — les images publiées embarquaient des
# paquets que Debian avait déjà corrigés. Chaque lundi, Dependabot regarde le digest de python:3.12-slim
# et ouvre une seule PR pour les deux Dockerfile (le groupe ci-dessous) quand il a bougé ; jamais une
# autre version de Python (3.13 : une montée mineure, ignorée — elle se décide, elle ne se propose pas).
# La PR passe la CI et la relecture comme une autre (docs/sessions.md, « Les releases »), avant la porte
# de release de la version suivante. La porte de release refuse une CVE élevée ou critique corrigée en amont
# dans les paquets du système (scripts/image_cves.py, release-gate.yml) : une release attend la montée.
# tests/unit/test_image_cves.py garde ce fichier face aux Dockerfile du dépôt.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /glorfindel
      - /annatar
    schedule:
      interval: weekly
      day: monday
    groups:
      base-image:
        patterns:
          - python
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(images)"
