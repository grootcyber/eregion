# Eregion (MOB1, #686) — the workstation's SSH server, in WSL, for the phone: a model, applied by the
# operator (docs/demarrer/mobile.md), never by a session. Copy it as
#   sudo install -m 644 infra/poste/sshd_config.d/00-eregion.conf /etc/ssh/sshd_config.d/00-eregion.conf
# then replace the address below by the one `tailscale ip -4` gives, and the user by yours.
#
# Why « 00- »: sshd keeps the FIRST value it reads for a keyword, and the files of sshd_config.d are read
# in their names' order — a « 50-cloud-init.conf » that says « PasswordAuthentication yes » would win over
# an « eregion.conf ». `sudo sshd -t` checks the syntax; `make mobile-check` reads what sshd really applies
# (sshd -T), the listeners (ss) and the tailnet.

# The private address alone: never 0.0.0.0, never [::], never the loopback (WSL shares it with Windows).
ListenAddress 100.64.0.1

# The key alone, kept in the phone's secure chip and unlocked by biometrics.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no
GSSAPIAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitRootLogin no
AllowUsers operator

# The phone needs a terminal, nothing more: no forwarding through the workstation, no agent, no X11.
# The console of H0 reaches the phone by the tunnel bound to the private address
# (make glorfindel-host-tunnel-private), not through this server.
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no

# Short attempts, a session that does not outlive its phone.
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 60
ClientAliveCountMax 3
