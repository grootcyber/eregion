# Eregion (MOB1, #686) — the SSH server waits for the tailnet's address before it listens on it: a model,
# applied by the operator (docs/demarrer/mobile.md). Copy it as
#   sudo install -D -m 644 infra/poste/ssh.service.d/eregion.conf /etc/systemd/system/ssh.service.d/eregion.conf
#   sudo systemctl daemon-reload
# With `ListenAddress <the private address>` alone, sshd started before tailscaled has its address would
# fail to bind: it waits for it here (one minute at most), and starts again after a failure.
# On Ubuntu 22.10 and later, ssh is socket-activated: ssh.socket listens, not sshd, and a generator copies
# ListenAddress and Port into it at each daemon-reload — a socket started before the tailnet's address,
# which this drop-in does not hold. Hence, once: `sudo systemctl disable --now ssh.socket`, then
# `sudo systemctl enable --now ssh.service`.
# Measured on the workstation on 12/11, after a restart (MOB3): tailscaled active, then ssh.service two
# seconds later, neither restarted; /run/sshd recreated by the service. From which this drop-in is deduced
# to have held — its wait itself was not watched. Not measured: what ssh.socket listens on when left
# enabled; `make mobile-check` reads what listens, whatever started it.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'i=0; until /usr/bin/tailscale ip -4 >/dev/null 2>&1; do i=$((i+1)); [ "$i" -lt 30 ] || exit 1; sleep 2; done'
Restart=on-failure
RestartSec=5
