# Eregion's public manual (MAN1, #664; in English since MAN1b, #676): the project's state, component by
# component. The page docs/manuel/index.html reads it through modules.json, which `make manuel` writes from
# this file.
#
# Who writes it: a lot's pull request updates its brick (its state, its release, its lots, its issue, its
# pull request), in English; a fragment changes/<LOT>.md without a brick on `main` naming LOT fails
# tests/unit/test_manuel.py. `make release` moves the bricks on `main` to `livree`, with the version.
#
# The public rule (the preview Jonathan validated on 06/11):
#   - a security brick (its lots SEC-…, V-<n>, P-0…, in any case; `securite: true`; or its issue or its
#     pull request in issues_securite) is named « Security hardening », without a note nor a document
#     but SECURITY.md; until it is delivered, it sits on s-signer; the page shows neither its issue nor
#     its pull request: never a finding here;
#   - no text of the manual names a finding (SEC-…, V-<n>, P-0…);
#   - no operator's gesture, no review: those fields do not exist;
#   - a note only on a brick delivered;
#   - every text in English (docs/sessions.md, « Le manuel public »).
#
# A lot that extends a brick already delivered takes a new brick: the original version stays said.
#
# The format: a strict subset of YAML (scripts/manuel.py, its header). Texts between straight double
# quotes, without « " » nor « \ » inside; versions always quoted. The ids, the keys and the states are
# the repository's own words and stay as they are (scripts/release.py and the private manual read them).
# A brick's states: prevue (planned), dev, relecture (in review), main, livree (released). A release's:
# publiee (published), montage (being assembled), prevue (planned).

# The issues of the security audit of 06/11 and of its follow-ups, then the known security pull requests
# (SEC-D #639, SEC-A1 #643, SEC-A2 #645, SEC-A3 #653, SEC-A4 #666): their titles often carry the finding.
# GitHub numbers issues and pull requests in one sequence: a number names only one of the two. A brick
# whose issue or one of whose pull requests is listed here is a security brick.
issues_securite: [630, 631, 632, 633, 634, 635, 636, 638, 642, 644, 654, 660, 639, 643, 645, 653, 666]

composants:
  - id: glorfindel
    nom: "Glorfindel"
    role: "The product: detects, investigates, decides, acts, verifies, learns."
    doc: docs/glorfindel.md
  - id: annatar
    nom: "Annatar"
    role: "The attack: public libraries, at a pinned version, on enrolled targets."
    doc: docs/architecture.md
  - id: gothmog
    nom: "Gothmog"
    role: "Declared faults, run by a public engine; they test Glorfindel first."
    doc: gothmog/README.md
  - id: orodruin
    nom: "Orodruin"
    role: "The injectors' host: nothing acts outside an armed Orodruin."
    doc: docs/design/orodruin-contract.md
  - id: celebrimbor
    nom: "Celebrimbor"
    role: "The bench: built, enrolled, disposable."
    doc: infra/terraform
  - id: console
    nom: "Console and Dagorlad"
    role: "What the human sees, judges and asks for."
    doc: docs/design/console.md
  - id: analyse
    nom: "Analysis AI"
    role: "Explains, triages, reports; never writes a rule."
    doc: docs/analysis.md
  - id: socle
    nom: "Foundation and proofs"
    role: "Under everything else: hosting, proving, signing, documenting."
    doc: docs/design/preuves.md

