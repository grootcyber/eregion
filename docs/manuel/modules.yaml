# The steps of the road, in order. A release published says its last version.
releases:
  - version: "0.2"
    nom: "the first release"
    etat: publiee
    derniere: "0.2.0"
    date: "2026-10-15"
    resume: "Glorfindel detects and responds on Azure, under guardrails in code; Annatar plays its scenarios; the invariants hold on a fake Azure."
  - version: "0.3"
    nom: "the loop runs"
    etat: publiee
    derniere: "0.3.1"
    date: "2026-10-27"
    resume: "From an armed Orodruin, a public technique and a declared fault on enrolled targets; Glorfindel hosted beside the bench; the campaign report writes itself."
  - version: "0.4"
    nom: "the isolation path held"
    etat: publiee
    derniere: "0.4.10"
    date: "2026-11-02"
    resume: "Isolation held to its invariants; its edges (console, logs, channels) and its core hardened; publishing a release deploys the hosted Glorfindel."
  - version: "0.5"
    nom: "the measured loop"
    etat: publiee
    derniere: "0.5.9"
    date: "2026-11-10"
    resume: "The loop measured on real traffic, the correlation, the signed action queue, signed proofs from end to end."
  - version: "0.6"
    nom: "identity defended"
    etat: montage
    resume: "The Activity and Entra ID logs measured on the bench; a public technique against the test identity, seen by Glorfindel; the response to a stolen identity, on the card."
  - version: "0.x"
    nom: "the proof at the customer's"
    etat: prevue
    resume: "Detection only in production, a sentinel VM, a twin and its gap report; precision measured on real data."
  - version: "1.0"
    nom: "the CDR proven"
    etat: prevue
    resume: "The maturity criteria met, the contracts frozen, the profiles proven in CI, the proof in production."
  - version: "1.x"
    nom: "new clouds, new engines"
    etat: prevue
    resume: "AWS and GCP, Kubernetes, the attack during a fault."

