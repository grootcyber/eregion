schema_version: "1"
name: managed-identity-federated-credential
description: >
  T1098 — Persistance d'identité : ajout d'un federated identity credential (FIC) de porte
  dérobée à une identité managée, par la bibliothèque publique épinglée (cycle
  warmup/detonate/revert/cleanup), depuis Orodruin armé, sur le plan de contrôle. C'est la carte
  d'identité de la 0.6.0. La technique crée sa propre identité dans le groupe inscrit du warmup
  (R2b), pas sur l'utilisateur de test. La détection sur le journal d'activité (azure_activity)
  est mesurée au banc (ID1, #281) ; ici la détection reste « unknown », T0 émis pour cette mesure.
kind: technique
mitre: T1098
version: "1.0.0"
engine: stratus
engine_ref: azure.persistence.backdoor-managed-identity-fic
destructive: false

target:
  type: azure_control_plane
  # Le groupe du warmup inscrit par Orodruin (eregion-target / eregion-zone=bench) — R2b.
  # Remplacer par le vôtre ; un abonnement de test dédié (R2b). subscription_id est pris dans
  # AZURE_SUBSCRIPTION_ID s'il n'est pas donné ici.
  resource_group: rg-celebrimbor

detection:
  timeout: "600s"
  prerequisites:
    - name: azure_activity_ingestion
      table: AzureActivity
      why: >
        La technique agit sur le plan de contrôle (ajout d'un federated credential à une identité
        managée) ; elle n'apparaît que dans le journal d'activité, dont l'ingestion au banc est ID1.
      verify: "AzureActivity | where TimeGenerated > ago(1h) | limit 1"
  hints:
    log_source: azure_activity
    attack_commands_summary: >
      La bibliothèque publique épinglée crée une identité managée dans le groupe inscrit, lui
      ajoute un federated identity credential de porte dérobée (detonate), le retire (revert) et
      détruit ses prérequis (cleanup). Une sonde Graph en lecture seule vérifie l'état initial
      avant détonation et l'absence des objets après nettoyage.
    expected_indicators:
      - "AzureActivity: écriture d'un federated identity credential sur une identité managée (Microsoft.ManagedIdentity .../federatedIdentityCredentials/write)"
      - "InitiatedBy / Caller : l'identité d'Orodruin (l'appelant du plan de contrôle)"
      - "ActivityStatusValue / ResultType : Success"
    failure_candidates:
      - "AzureActivity | where OperationNameValue has 'federatedIdentityCredentials/write' | where TimeGenerated > ago(10m)"
      - "AzureActivity | where ResourceProviderValue == 'Microsoft.ManagedIdentity' | where TimeGenerated > ago(10m)"
      - "Le journal d'activité peut arriver avec plusieurs minutes de retard — fenêtre de détection >= 600 s (ING1)"
